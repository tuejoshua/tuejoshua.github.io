    body {

    img {
      width: 500px;
      height: auto;
      transform-origin: center center;
      cursor: grab;
      transition: transform 0.3s ease;
      /* smooth reset animation */
    }

    img:active {
      cursor: grabbing;
      transition: none;
      /* disable animation while dragging */
    }
  </style>

<body>
  <div id="container">
    <!-- button id="resetBtn">Reset</button-->
    Today is <span id="todaysDate">[working...]</span>
    ▶&nbsp;
    <img id="wheel" src="./åretsHjul.drawio.svg" alt="Wheel">
  </div>

  <script type="module">
    import { HDate } from "https://esm.sh/hebcal@2.3.2";

    const img = document.getElementById('wheel');
    const resetBtn = document.getElementById('resetBtn');

    // disable native drag image and gestures
    wheel.ondragstart = () => false;
    wheel.style.touchAction = 'none'; // prevents browser touch gestures interfering
    wheel.style.userSelect = 'none';

    let isDragging = false;
    let startAngle = 0;
    let newAngle = 0;
    let initialRotation = 0;

    // Fixed 13-month wheel
    const months13 = [
      "Nisan", "Iyyar", "Sivan", "Tamuz", "Av", "Elul",
      "Tishrei", "Cheshvan", "Kislev", "Tevet", "Shevat", "Adar I", "Adar II"
    ];

    const today = new HDate();
    // console.log('Today\'s date received from HebCal: ' + today);
    todaysDate.textContent = today;

    function getHebrewAngle(hebDate) {
    /* This function converts a Hebrew date to an angle, where
       Date X is Q and Y is W (TBD!!!)
       The conversion is approximate - assuming that all Hebrew months are equally long
       (so each take up 1/12th aka. 30 degrees of a full circle)
       - in practice, each month has either 29, 30 or vary between the two,
       which seems like a sufficient precision
    */
      const totalMonths = months13.length; // always 13
      const monthIndex = months13.indexOf(hebDate.getMonthName());
      //console.log('today.getMonthName(): ' + hebDate.getMonthName());
      const day = hebDate.getDate();
      //console.log('day: ' + day);
      const daysInMonth = hebDate.daysInMonth(); // Correct method call

      const fracYear = (monthIndex + (day - 1) / daysInMonth) / totalMonths;
      return -90 - fracYear * 360; // 90 because the year starts at Nisan, which is at the top of the figure, but we want today's date rotated to the left
    }

    function rotateImageAccordingToHebDate(hebDate) {
      newAngle = getHebrewAngle(hebDate);
      console.log('new rotation angle: ' + newAngle);
      img.style.transform = `rotate(${newAngle}deg)`;
    }

    rotateImageAccordingToHebDate(today);

    // --- Drag handling ---
    function getPointerAngle(e) {
      const rect = img.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - cy;
      return Math.atan2(y, x) * 180 / Math.PI;
    }


    // --- Pointer Events: works for mouse cursor + touch position ---
    img.addEventListener('pointerdown', e => {
      isDragging = true;
      img.setPointerCapture(e.pointerId); // Even if pointer moves outside image, keep rotating
      startAngle = getPointerAngle(e) - newAngle;
    });

    img.addEventListener('pointermove', e => {
      if (!isDragging) return;
      newAngle = getPointerAngle(e) - startAngle;
      img.style.transform = `rotate(${newAngle}deg)`;
    });

    img.addEventListener('pointerup', e => { // Undo 'pointerdown' above
      isDragging = false;
      img.releasePointerCapture(e.pointerId);
      // Rotate back to today's date
      newAngle = initialRotation;
      img.style.transform = `rotate(${newAngle}deg)`;
    });

    img.addEventListener('pointercancel', () => {
      isDragging = false;
    });

      img.style.transform = `rotate(${currentRotation}deg)`;
    });

  </script>
</body>
