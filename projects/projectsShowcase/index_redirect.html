<!DOCTYPE html>
<!-- At one point, I did not have an index.html file at the server root
 and wanted the URL "tuejoshua.github.io" to redirect to the file
 "tuejoshua.github.io/projects.html".
 This file does exactly that when named index.html and located at the root.
 Since I no longer use that strategy, this file is obsolete,
 has been renamed (to avoid unintentional activation of its functionality) and
 moved to a project folder until I finally decide it's not even worth keeping
 for nostalgia... -->

<!-- GitHub Pages will not serve 404.html for this / the server root page
- so we need this dedicated redirect file... -->
<html>

<head>
  <meta http-equiv="refresh" content="0; URL=projects.html">
  <title>Tue Joshua on Github</title>
</head>

<body>
  <p>Redirecting to <a href="projects.html">projects.html</a>...</p>
</body>

</html>
